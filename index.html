<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>github-login-form</title>
    <!-- bootstrap cdn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
     <!-- font-awesome cdn -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- custom-css -->
      <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container full-height d-flex justify-content-center align-items-center">
  <div class="row w-100">
    <div class="col-sm-12 col-md-6 col-lg-6 col-12 mx-auto py-5">
      <div class="d-flex text-center" id="d-flex">
        <i class="fa-brands fa-github"></i>
        <p class="fs-3">Sign in to GitHub</p>
      </div>
 <form action="">
    
    <div class="b">
  <div class="input-group">
    <div class="label-row">
      <label for="email adddress">Username or email address</label>
     
    </div>
    
    <input type="email"  name="email" id="first-input">
  </div>
  
  <div class="input-group">
    <div class="label-row" id="label-row">
      <label for="password">Password</label>
      <a href="#">Forgot Password?</a>
    </div>
    <input type="password" id="password" name="password">
  </div>
  

  <div class="d-grid py-3">
    <button class="btn btn-success" type="button">Sign in</button>
  </div>
    </div>
    <div class="d">
  <div class="top-banner">
    <span class="passkey">Sign in with a passkey</span>
    <span class="signup">New to GitHub?
      <a href="#">Create an account</a>
    </span>
  </div>
  </div>
 </form>
 <footer>
 <div class="d-flex" id="footer-dflex">
  <ul>
    <li>Terms</li>
    <li>Privacy</li>
    <li>Docs</li>
    <li>Contact GitHub Support</li>
  </ul>
  
 </div>
 <div class="footer-extra">
  <span class="manage-cookies">Manage Cookies</span>
  <p class="footer-note">Do not share my personal information.</p>
</div>
 </footer>
</div>
</div>
  </div>



    <!-- bootstrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
